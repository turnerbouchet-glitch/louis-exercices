<!doctype html>
<html lang="fr"><head>
<meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz n°1 · Fin de l'Empire romain</title>
<style>
:root{--bg:#f6f5f9;--paper:#fff;--ink:#221c2e;--muted:#5d5670;--line:#dcd7e6;--purple:#5a3486;--purple-soft:#efe8f7;--gold:#b27a14;--gold-soft:#fbf1dc;--ok:#2f7d4f;--ok-soft:#e3f4ea;--bad:#b23b3b;--bad-soft:#fbe6e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:19px;line-height:1.5;padding:24px 16px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:Georgia,"Times New Roman",serif;color:var(--purple);font-size:30px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.count{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.q{font-size:22px;font-weight:700;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);padding:12px 14px;color:var(--ink);display:flex;gap:12px;align-items:flex-start}
.opt b{color:var(--purple);min-width:1.2em}
.opt:hover:not(:disabled){border-color:var(--purple)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;padding:12px 18px;font-weight:700;background:var(--purple);color:#fff}
.btn.light{background:var(--purple-soft);color:var(--purple)}
.hint{background:var(--gold-soft);border-radius:10px;padding:10px 14px}
.fb{border-radius:10px;padding:12px 14px}
.fb.ok{background:var(--ok-soft)} .fb.ko{background:var(--bad-soft)}
.fb strong{display:block}
.stars{font-size:48px;color:var(--gold);letter-spacing:6px}
.score{font-size:28px;font-weight:700}
ul{margin:0;padding-left:22px}
[hidden]{display:none!important}
</style></head><body>
<div class="wrap">
  <header><h1>Quiz n°1</h1><p class="sub">La fin de l'Empire romain · 18 questions. Lis bien la question, tu peux demander un indice.</p></header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="quiz">
    <div class="count" id="count"></div>
    <p class="q" id="q"></p>
    <div class="opts" id="opts"></div>
    <div class="hint" id="hint" hidden></div>
    <div class="fb" id="fb" hidden></div>
    <div class="row">
      <button class="btn light" id="hintBtn" type="button">Un indice ?</button>
      <button class="btn" id="next" type="button" hidden>Question suivante</button>
    </div>
  </div>
  <div class="card" id="end" hidden>
    <div class="stars" id="stars"></div>
    <div class="score" id="score"></div>
    <p id="msg" style="margin:0"></p>
    <div id="review"></div>
    <div class="row"><button class="btn" id="again" type="button">Recommencer</button></div>
  </div>
</div>
<script>
const QS = [{"q": "Pourquoi les Barbares attaquent-ils l'Empire romain ?", "o": ["Ils sont attirés par ses richesses", "Ils veulent apprendre le latin", "Ils fuient la mer", "L'empereur les invite"], "a": 0, "h": "Pense à ce que possède un empire très riche…", "e": "Les Barbares sont attirés par les richesses de l'Empire romain. Ils viennent du Nord-Est de l'Europe."}, {"q": "Qu'est-ce que le limes ?", "o": ["Un outil pour limer le bois", "La frontière fortifiée de l'Empire romain", "Un peuple barbare", "La capitale de l'Orient"], "a": 1, "h": "Il y a des forts, des fossés, des palissades…", "e": "Le limes est la frontière renforcée de l'Empire, avec des forts, des fossés, des routes, des palissades et parfois des murs."}, {"q": "Quel mur célèbre protégeait l'Empire romain en Grande-Bretagne ?", "o": ["Le mur de Berlin", "La muraille de Chine", "Le mur d'Hadrien", "Le mur d'Attila"], "a": 2, "h": "", "e": "Le mur d'Hadrien, dans les îles britanniques, faisait partie du limes."}, {"q": "Lequel de ces moyens N'EST PAS utilisé par les Romains pour se protéger ?", "o": ["Construire des tours de guet", "Entourer les villes de remparts", "Partager l'Empire en deux", "Abandonner toutes leurs frontières"], "a": 3, "h": "Trois réponses sont de vraies protections.", "e": "Les Romains construisent des fortifications (limes, tours de guet, remparts) et partagent l'Empire en deux pour mieux le défendre."}, {"q": "En 286, quel empereur partage l'Empire romain en deux ?", "o": ["Constantin", "Dioclétien", "Romulus Augustule", "Attila"], "a": 1, "h": "", "e": "En 286, Dioclétien partage l'Empire en deux pour faciliter sa défense."}, {"q": "Pourquoi partager l'Empire le rend-il plus fort ?", "o": ["Il est plus facile à diriger et à défendre", "Il devient plus grand", "Les Barbares ne le trouvent plus", "Il n'a plus besoin de soldats"], "a": 0, "h": "", "e": "Chaque partie a son empereur et sa capitale : c'est plus facile à diriger et à défendre."}, {"q": "Quelle est la capitale de l'Empire romain d'Orient ?", "o": ["Rome", "Alexandrie", "Constantinople", "Carthage"], "a": 2, "h": "Elle porte le nom d'un empereur.", "e": "Constantinople est la capitale de l'Orient (à l'Est). Rome est celle de l'Occident (à l'Ouest). Constantin en a fait la capitale en 330."}, {"q": "D'où viennent les Huns ?", "o": ["Des steppes d'Asie centrale", "D'Afrique", "De Scandinavie", "D'Italie"], "a": 0, "h": "", "e": "Les Huns sont un peuple nomade turc venu des steppes d'Asie centrale."}, {"q": "Comment s'appelle le roi des Huns ?", "o": ["Hadrien", "Attila", "Odoacre", "Constantin"], "a": 1, "h": "", "e": "Attila est le roi des Huns. Le peintre Delacroix l'a représenté sur un cheval."}, {"q": "Quel rôle jouent les Huns dans les invasions ?", "o": ["Ils protègent Rome", "Ils poussent les peuples germains à entrer dans l'Empire", "Ils construisent le limes", "Ils fondent Constantinople"], "a": 1, "h": "", "e": "En 375, les Huns commencent une grande migration qui pousse les Germains (Francs, Goths, Vandales) à envahir l'Empire. Ils deviennent l'ennemi commun des Romains et des Barbares."}, {"q": "Dans le texte d'Ammien Marcellin, à quoi sont comparés les Huns ?", "o": ["À un ouragan", "À une rivière", "À un lion", "À une tempête de neige"], "a": 0, "h": "", "e": "Ils « s'abattent comme l'ouragan » et détruisent tout sur leur passage."}, {"q": "Quel peuple germain a donné son nom à la France ?", "o": ["Les Vandales", "Les Burgondes", "Les Francs", "Les Alamans"], "a": 2, "h": "", "e": "Les Francs → la France. Les Burgondes → la Bourgogne et la Suisse romande. Les Alamans → la Suisse alémanique et l'Allemagne."}, {"q": "Qui pille Rome en 410 ?", "o": ["Les Huns", "Les Goths", "Les Perses", "Les Francs"], "a": 1, "h": "", "e": "Rome est pillée par les Goths en 410, puis encore en 455 et 472."}, {"q": "Que se passe-t-il en 476 ?", "o": ["Les Huns arrivent en Europe", "L'Empire est partagé en deux", "Romulus Augustule est renversé : c'est la fin de l'Empire romain d'Occident", "Constantinople devient capitale"], "a": 2, "h": "C'est LA date la plus importante !", "e": "En 476, le dernier empereur d'Occident, Romulus Augustule, est renversé. C'est la fin de l'Antiquité et le début du Moyen Âge."}, {"q": "Qu'est-ce qui marque la fin de la Préhistoire et le début de l'Antiquité ?", "o": ["La chute de Rome", "L'apparition de l'écriture", "La découverte du feu", "L'arrivée des Huns"], "a": 1, "h": "", "e": "La Préhistoire se termine avec l'apparition de l'écriture. L'Antiquité se termine en 476, et le Moyen Âge commence."}, {"q": "Que veut dire IV en chiffres romains ?", "o": ["6", "4", "9", "11"], "a": 1, "h": "Le I est placé AVANT le V.", "e": "Quand un petit chiffre est placé avant un plus grand, on le soustrait : V (5) − I (1) = 4. VI = 6."}, {"q": "En quel siècle se trouve l'année 476 ?", "o": ["IVe siècle", "Ve siècle", "XLVIe siècle", "IIIe siècle"], "a": 1, "h": "Prends les centaines et ajoute 1.", "e": "476 → 4 centaines + 1 = 5e siècle, qui s'écrit Ve siècle."}, {"q": "Que veut dire « anarchie » ?", "o": ["Une grande armée", "Le désordre dû à l'absence de pouvoir politique", "Un mur de défense", "Une fête romaine"], "a": 1, "h": "", "e": "L'anarchie, c'est le désordre quand plus personne ne dirige vraiment."}];
const OK=["Bravo !","Exact !","Super !","Bien joué !","Oui !","Parfait !"];
let i=0, good=0, missed=[], order=[];
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function show(){
  const q=QS[i]; $("count").textContent="Question "+(i+1)+" / "+QS.length;
  $("prog").style.width=(i/QS.length*100)+"%";
  $("q").textContent=q.q; $("hint").hidden=true; $("fb").hidden=true; $("next").hidden=true;
  $("hintBtn").hidden=!q.h; $("hint").textContent="💡 "+q.h;
  const box=$("opts"); box.innerHTML=""; order=shuffle(q.o.map((t,k)=>k));
  order.forEach((k,n)=>{const b=document.createElement("button");b.type="button";b.className="opt";
    b.innerHTML="<b>"+"ABCD"[n]+"</b><span></span>";b.querySelector("span").textContent=q.o[k];
    b.onclick=()=>answer(k,b);box.appendChild(b)});
}
function answer(k,btn){
  const q=QS[i]; const btns=[...$("opts").children];
  btns.forEach((b,n)=>{b.disabled=true;if(order[n]===q.a)b.classList.add("good")});
  const fb=$("fb"); fb.hidden=false;
  if(k===q.a){good++;fb.className="fb ok";fb.innerHTML="<strong>"+OK[i%OK.length]+"</strong>"}
  else{btn.classList.add("wrong");missed.push(i);fb.className="fb ko";fb.innerHTML="<strong>Pas tout à fait. La bonne réponse est en vert.</strong>"}
  const p=document.createElement("span");p.textContent=q.e;fb.appendChild(p);
  $("hintBtn").hidden=true; $("next").hidden=false;
  $("next").textContent=i===QS.length-1?"Voir mon score":"Question suivante"; $("next").focus();
}
$("hintBtn").onclick=()=>{$("hint").hidden=false};
$("next").onclick=()=>{i++; if(i<QS.length) show(); else end()};
function end(){
  $("prog").style.width="100%"; $("quiz").hidden=true; $("end").hidden=false;
  const pct=Math.round(good/QS.length*100);
  $("stars").textContent=pct>=90?"★★★":pct>=70?"★★☆":"★☆☆";
  $("score").textContent=good+" / "+QS.length+" ("+pct+" %)";
  $("msg").textContent=pct>=90?"Excellent, tu connais très bien ta leçon !":pct>=70?"Très bien ! Relis les questions ci-dessous et recommence.":"Continue ! Relis ta fiche de synthèse, puis recommence le quiz.";
  const r=$("review"); r.innerHTML="";
  if(missed.length){const h=document.createElement("p");h.style.margin="0 0 6px";h.innerHTML="<strong>À revoir :</strong>";r.appendChild(h);
    const ul=document.createElement("ul");missed.forEach(m=>{const li=document.createElement("li");li.textContent=QS[m].q+" → "+QS[m].o[QS[m].a];ul.appendChild(li)});r.appendChild(ul)}
}
$("again").onclick=()=>{i=0;good=0;missed=[];$("end").hidden=true;$("quiz").hidden=false;show()};
show();
</script></body></html>
