<!doctype html>
<html lang="fr"><head>
<meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz n°3 · Fin de l'Empire romain</title>
<style>
:root{--bg:#f6f5f9;--paper:#fff;--ink:#221c2e;--muted:#5d5670;--line:#dcd7e6;--purple:#5a3486;--purple-soft:#efe8f7;--gold:#b27a14;--gold-soft:#fbf1dc;--ok:#2f7d4f;--ok-soft:#e3f4ea;--bad:#b23b3b;--bad-soft:#fbe6e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:19px;line-height:1.5;padding:24px 16px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:Georgia,"Times New Roman",serif;color:var(--purple);font-size:30px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.count{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.q{font-size:22px;font-weight:700;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);padding:12px 14px;color:var(--ink);display:flex;gap:12px;align-items:flex-start}
.opt b{color:var(--purple);min-width:1.2em}
.opt:hover:not(:disabled){border-color:var(--purple)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;padding:12px 18px;font-weight:700;background:var(--purple);color:#fff}
.btn.light{background:var(--purple-soft);color:var(--purple)}
.hint{background:var(--gold-soft);border-radius:10px;padding:10px 14px}
.fb{border-radius:10px;padding:12px 14px}
.fb.ok{background:var(--ok-soft)} .fb.ko{background:var(--bad-soft)}
.fb strong{display:block}
.stars{font-size:48px;color:var(--gold);letter-spacing:6px}
.score{font-size:28px;font-weight:700}
ul{margin:0;padding-left:22px}
[hidden]{display:none!important}
</style></head><body>
<div class="wrap">
  <header><h1>Quiz n°3</h1><p class="sub">La fin de l'Empire romain · 16 questions. Lis bien la question, tu peux demander un indice.</p></header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="quiz">
    <div class="count" id="count"></div>
    <p class="q" id="q"></p>
    <div class="opts" id="opts"></div>
    <div class="hint" id="hint" hidden></div>
    <div class="fb" id="fb" hidden></div>
    <div class="row">
      <button class="btn light" id="hintBtn" type="button">Un indice ?</button>
      <button class="btn" id="next" type="button" hidden>Question suivante</button>
    </div>
  </div>
  <div class="card" id="end" hidden>
    <div class="stars" id="stars"></div>
    <div class="score" id="score"></div>
    <p id="msg" style="margin:0"></p>
    <div id="review"></div>
    <div class="row"><button class="btn" id="again" type="button">Recommencer</button></div>
  </div>
</div>
<script>
const QS = [{"q": "Quel empereur a donné son nom à la ville de Constantinople ?", "o": ["Dioclétien", "Constantin", "Hadrien", "Romulus Augustule"], "a": 1, "h": "Écoute bien le nom de la ville.", "e": "Constantin a fait de la ville qui porte son nom la nouvelle capitale de l'Empire, en 330."}, {"q": "Qu'est-ce qui s'est passé en premier ?", "o": ["Le pillage de Rome par les Goths", "Le partage de l'Empire par Dioclétien", "La chute de l'Empire d'Occident", "Le passage du Rhin par les Barbares"], "a": 1, "h": "Cherche la plus petite date.", "e": "L'ordre est : 286 (partage de l'Empire), 406 (passage du Rhin), 410 (pillage de Rome), 476 (chute de l'Occident)."}, {"q": "Qui était Ammien Marcellin ?", "o": ["Un roi barbare", "Un historien romain qui a écrit sur les Huns", "Le dernier empereur de Rome", "Un peintre"], "a": 1, "h": "", "e": "Ammien Marcellin est un historien romain. C'est lui qui a écrit le texte qui décrit les Huns."}, {"q": "D'après Ammien Marcellin, que mangent les Huns ?", "o": ["Du pain et du fromage", "Des racines sauvages et de la viande attendrie sous leurs selles", "Des plats cuits avec des épices", "Du poisson"], "a": 1, "h": "", "e": "Selon lui, les Huns ne cuisent pas leurs aliments. Ils mangent des racines sauvages et de la viande attendrie sous la selle de leur cheval."}, {"q": "Quel peintre a représenté Attila sur un cheval ?", "o": ["Delacroix", "Picasso", "Van Gogh", "Monet"], "a": 0, "h": "", "e": "L'image d'Attila sur la fiche est un détail d'une fresque peinte par Eugène Delacroix."}, {"q": "À quoi sert une tour de guet ?", "o": ["À stocker le blé", "À surveiller l'arrivée des ennemis", "À loger l'empereur", "À prier les dieux"], "a": 1, "h": "", "e": "Du haut de la tour de guet, les soldats surveillent et voient arriver les ennemis de loin."}, {"q": "Quel peuple force les Germains à franchir le limes au IIIe siècle ?", "o": ["Les Scandinaves (Goths)", "Les Maures", "Les Égyptiens", "Les Grecs"], "a": 0, "h": "", "e": "Au IIIe siècle, les Scandinaves (Goths) forcent les peuples germains à franchir le limes."}, {"q": "Que veulent les Perses ?", "o": ["Reconquérir l'Orient", "Traverser le Rhin", "Prendre la Gaule", "Construire le limes"], "a": 0, "h": "", "e": "Les Perses veulent reconquérir l'Orient, la partie Est de l'Empire."}, {"q": "Où les Burgondes s'installent-ils ?", "o": ["En Afrique", "En Gaule (au Nord, puis au Centre-Est)", "En Grande-Bretagne", "À Constantinople"], "a": 1, "h": "", "e": "Les Burgondes fondent un royaume au Nord, puis au Centre-Est de la Gaule. Il comprend une partie de la Suisse romande actuelle."}, {"q": "Quel fleuve les Barbares franchissent-ils en 406 ?", "o": ["Le Nil", "Le Rhin", "La Seine", "Le Danube"], "a": 1, "h": "", "e": "En 406, plusieurs peuples franchissent le Rhin, qui formait une frontière de l'Empire."}, {"q": "Le « sac de Rome » en 410, ça veut dire…", "o": ["Que Rome est pillée", "Que Rome construit un grand sac", "Que Rome fait une fête", "Que Rome devient capitale"], "a": 0, "h": "", "e": "Un « sac », c'est quand une ville est pillée et détruite par des ennemis. En 410, les Goths pillent Rome."}, {"q": "Dans l'âge des Métaux, quel métal vient en premier ?", "o": ["Le fer", "L'or", "Le bronze", "L'argent"], "a": 2, "h": "", "e": "D'abord l'âge du Bronze (2300 à 800 av. J.-C.), puis l'âge du Fer (800 à 50 av. J.-C.)."}, {"q": "Où l'écriture apparaît-elle pour la première fois, vers 3300 av. J.-C. ?", "o": ["En Suisse", "En Mésopotamie", "À Rome", "Chez les Huns"], "a": 1, "h": "", "e": "L'écriture apparaît vers 3300 av. J.-C. en Mésopotamie. Chez nous, en Suisse, elle arrive bien plus tard, vers 50 av. J.-C."}, {"q": "Que vaut LX en chiffres romains ?", "o": ["40", "60", "15", "110"], "a": 1, "h": "L = 50 et X = 10. Le X est après le L.", "e": "Le X est après le L, donc on ajoute : 50 + 10 = 60. (XL serait 50 − 10 = 40.)"}, {"q": "Le IIIe siècle, ce sont quelles années ?", "o": ["De 1 à 100", "De 201 à 300", "De 301 à 400", "De 3000 à 3100"], "a": 1, "h": "Le Ier siècle, c'est de 1 à 100.", "e": "Ier siècle : 1 à 100. IIe siècle : 101 à 200. IIIe siècle : 201 à 300."}, {"q": "Quelle ville apparaît comme capitale de l'Occident sur la carte de l'Empire ?", "o": ["Ravenne", "Alexandrie", "Carthage", "Constantinople"], "a": 0, "h": "", "e": "Sur la carte, Ravenne est écrite en grand dans l'Occident. Le texte « À retenir » dit que Rome est la capitale : les deux ont été capitales. Pour l'examen, retiens surtout Rome."}];
const OK=["Bravo !","Exact !","Super !","Bien joué !","Oui !","Parfait !"];
let i=0, good=0, missed=[], order=[];
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function show(){
  const q=QS[i]; $("count").textContent="Question "+(i+1)+" / "+QS.length;
  $("prog").style.width=(i/QS.length*100)+"%";
  $("q").textContent=q.q; $("hint").hidden=true; $("fb").hidden=true; $("next").hidden=true;
  $("hintBtn").hidden=!q.h; $("hint").textContent="💡 "+q.h;
  const box=$("opts"); box.innerHTML=""; order=shuffle(q.o.map((t,k)=>k));
  order.forEach((k,n)=>{const b=document.createElement("button");b.type="button";b.className="opt";
    b.innerHTML="<b>"+"ABCD"[n]+"</b><span></span>";b.querySelector("span").textContent=q.o[k];
    b.onclick=()=>answer(k,b);box.appendChild(b)});
}
function answer(k,btn){
  const q=QS[i]; const btns=[...$("opts").children];
  btns.forEach((b,n)=>{b.disabled=true;if(order[n]===q.a)b.classList.add("good")});
  const fb=$("fb"); fb.hidden=false;
  if(k===q.a){good++;fb.className="fb ok";fb.innerHTML="<strong>"+OK[i%OK.length]+"</strong>"}
  else{btn.classList.add("wrong");missed.push(i);fb.className="fb ko";fb.innerHTML="<strong>Pas tout à fait. La bonne réponse est en vert.</strong>"}
  const p=document.createElement("span");p.textContent=q.e;fb.appendChild(p);
  $("hintBtn").hidden=true; $("next").hidden=false;
  $("next").textContent=i===QS.length-1?"Voir mon score":"Question suivante"; $("next").focus();
}
$("hintBtn").onclick=()=>{$("hint").hidden=false};
$("next").onclick=()=>{i++; if(i<QS.length) show(); else end()};
function end(){
  $("prog").style.width="100%"; $("quiz").hidden=true; $("end").hidden=false;
  const pct=Math.round(good/QS.length*100);
  $("stars").textContent=pct>=90?"★★★":pct>=70?"★★☆":"★☆☆";
  $("score").textContent=good+" / "+QS.length+" ("+pct+" %)";
  $("msg").textContent=pct>=90?"Excellent, tu connais très bien ta leçon !":pct>=70?"Très bien ! Relis les questions ci-dessous et recommence.":"Continue ! Relis ta fiche de synthèse, puis recommence le quiz.";
  const r=$("review"); r.innerHTML="";
  if(missed.length){const h=document.createElement("p");h.style.margin="0 0 6px";h.innerHTML="<strong>À revoir :</strong>";r.appendChild(h);
    const ul=document.createElement("ul");missed.forEach(m=>{const li=document.createElement("li");li.textContent=QS[m].q+" → "+QS[m].o[QS[m].a];ul.appendChild(li)});r.appendChild(ul)}
}
$("again").onclick=()=>{i=0;good=0;missed=[];$("end").hidden=true;$("quiz").hidden=false;show()};
show();
</script></body></html>
