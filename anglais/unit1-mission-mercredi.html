<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission anglais mercredi</title>
<style>
:root{
  --bg:#f6f4ee; --paper:#fff; --ink:#22242c; --muted:#6a6c76; --line:#e2ded2;
  --gold:#f2b705; --goldSoft:#fff2c2; --blue:#2c6fb7; --blueSoft:#e3eefa;
  --ok:#2e8a4e; --okSoft:#e0f3e6; --bad:#c23b2e; --badSoft:#fbe4e1;
  --font:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1b20; --paper:#25272e; --ink:#f0eee6; --muted:#a3a5ae; --line:#3a3c45;
  --goldSoft:#3d3314; --blue:#7fb2ec; --blueSoft:#1f2f44; --ok:#62cf88; --okSoft:#1c3a27; --bad:#ff8a7b; --badSoft:#45221e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1b20; --paper:#25272e; --ink:#f0eee6; --muted:#a3a5ae; --line:#3a3c45;
  --goldSoft:#3d3314; --blue:#7fb2ec; --blueSoft:#1f2f44; --ok:#62cf88; --okSoft:#1c3a27; --bad:#ff8a7b; --badSoft:#45221e; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.45;padding:0 16px 48px}
.wrap{max-width:760px;margin:0 auto}
header{padding:26px 0 10px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{margin:0;font-size:1.9rem;line-height:1.1}
h1 small{display:block;font-size:1rem;color:var(--muted);font-weight:600;margin-top:4px}
.total{background:var(--goldSoft);border-radius:999px;padding:6px 16px;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap}
.steps i{flex:1;min-width:40px;height:8px;border-radius:99px;background:var(--line)}
.steps i.done{background:var(--gold)}
.steps i.now{background:var(--blue)}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}
.kicker{color:var(--muted);font-weight:700;font-size:.9rem;text-transform:uppercase;letter-spacing:.04em}
h2{margin:4px 0 6px;font-size:1.45rem}
.help{color:var(--muted);margin:0 0 14px}
.q{font-size:1.35rem;font-weight:700;margin:6px 0 14px}
.big{font-size:3rem;line-height:1;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
button{font:inherit;color:inherit}
.opt,.tile,.btn{cursor:pointer;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font-weight:700;transition:transform .1s,border-color .15s,background .15s}
.opt:hover,.tile:hover{border-color:var(--blue)}
.opt:active,.tile:active,.btn:active{transform:scale(.97)}
.opt.ok{background:var(--okSoft);border-color:var(--ok)}
.opt.bad{background:var(--badSoft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.btn{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#111}}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;display:none}
.fb.ok{display:block;background:var(--okSoft)}
.fb.bad{display:block;background:var(--badSoft)}
input[type=text]{font:inherit;font-size:1.4rem;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:min(100%,280px);letter-spacing:.05em}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.answer{min-height:58px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answer:empty::before{content:"Clique sur les mots dans l'ordre…";color:var(--muted);padding:4px 6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tile{padding:8px 12px}
.tile.used{visibility:hidden}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{cursor:pointer;aspect-ratio:1.3;border-radius:14px;border:2px solid var(--line);background:var(--blueSoft);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:1.05rem;padding:6px}
.mc.hide{color:transparent}
.mc.hide::after{content:"?";color:var(--blue);font-size:1.8rem;position:absolute}
.mc{position:relative}
.mc.open{background:var(--paper);border-color:var(--blue)}
.mc.found{background:var(--okSoft);border-color:var(--ok);cursor:default}
.end{text-align:center}
.end .stars{font-size:2.4rem;letter-spacing:4px}
.end ul{text-align:left;display:inline-block}
.small{font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🇬🇧 Mission du mercredi<small>Anglais · Unit 1 (page 6) · environ 15 minutes</small></h1>
  <div class="total" id="total">⭐ 0 / 33</div>
</header>
<div class="steps" id="steps"></div>
<div id="app"></div>
<p class="small" style="margin-top:20px">Mets le son pour les boutons 🔊. Une ⭐ par bonne réponse du premier coup.</p>
</div>

<script>
// ---------- Voix anglaise ----------
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang.replace("_","-")));return v.find(x=>x.name.indexOf("Daniel")===0)||v.find(x=>/premium|enhanced|natural/i.test(x.name))||v.find(x=>/^en-GB/i.test(x.lang.replace("_","-")))||v[0]||null}catch(e){return null}}
let voice = null;
function loadVoice(){ try{ const v = speechSynthesis.getVoices(); voice = pickVoice(); }catch(e){} }
try{ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }catch(e){}
function say(t, rate){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-GB"; if (voice) u.voice = voice; u.rate = rate || .66; speechSynthesis.speak(u); }catch(e){} }

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ---------- Contenu ----------
const PARTS = [
  { id:"memory", title:"1. Memory des animaux", help:"Retourne 2 cartes : trouve chaque animal en anglais et son nom en français.",
    pairs:[["cat","chat 🐱"],["dog","chien 🐶"],["fish","poisson 🐟"],["hamster","hamster 🐹"],["mouse","souris 🐭"],["rabbit","lapin 🐰"]] },
  { id:"hisher", title:"2. His ou Her ?", help:"<b>His</b> = pour un garçon (ou un animal mâle). <b>Her</b> = pour une fille (ou un animal femelle).",
    items:[
      {e:"👧", t:"___ name's Sophie.", a:"Her", x:"Sophie est une fille → Her name's Sophie (elle s'appelle Sophie)."},
      {e:"👦", t:"___ name's Joël.", a:"His", x:"Joël est un garçon → His name's Joël (il s'appelle Joël)."},
      {e:"👧", t:"___ name's Léa.", a:"Her", x:"Léa est une fille → Her name's Léa."},
      {e:"👦", t:"___ name's Claudio.", a:"His", x:"Claudio est un garçon → His name's Claudio."},
      {e:"🐶", t:"This is my dog. ___ name's Max. (un chien mâle)", a:"His", x:"Max est un chien mâle → His name's Max."},
      {e:"🐱", t:"This is my cat. ___ name's Bella. (une chatte)", a:"Her", x:"Bella est une chatte → Her name's Bella."}
    ] },
  { id:"spell", title:"3. Écoute et écris", help:"Clique sur 🔊 : la voix épelle un mot lettre par lettre. Écris le mot. Tu as 2 essais.",
    items:[
      {w:"hamster", e:"🐹"}, {w:"Italy", e:"🇮🇹"}, {w:"Germany", e:"🇩🇪"}, {w:"village", e:"🏡"}, {w:"cool", e:"😎"}
    ] },
  { id:"build", title:"4. Construis la phrase", help:"Clique sur les mots dans le bon ordre. Attention : il y a parfois un mot en trop !",
    items:[
      {fr:"C'est mon chien.", s:["This","is","my","dog."], extra:"name's"},
      {fr:"Elle s'appelle Sophie.", s:["Her","name's","Sophie."], extra:"His"},
      {fr:"Comment vas-tu ?", s:["How","are","you?"], extra:"is"},
      {fr:"Comment t'appelles-tu ?", s:["What's","your","name?"], extra:"my"},
      {fr:"Comment épelles-tu Claudio ?", s:["How","do","you","spell","Claudio?"], extra:null}
    ] },
  { id:"size", title:"5. Le plus grand ?", help:"Choisis le lieu le plus grand.",
    items:[
      {o:["village","town"], a:"town", x:"village = village · town = petite ville. La petite ville est plus grande que le village."},
      {o:["town","city"], a:"city", x:"town = petite ville · city = grande ville."},
      {o:["city","country"], a:"country", x:"city = grande ville · country = pays. Un pays a beaucoup de villes."},
      {o:["region","country"], a:"country", x:"region = région · country = pays. Un pays a plusieurs régions (comme la Suisse)."},
      {o:["Switzerland","Europe"], a:"Europe", x:"Switzerland = la Suisse (un pays) · Europe = l'Europe (un continent)."}
    ] },
  { id:"tf", title:"6. Vrai ou faux ?", help:"Lis bien la phrase, puis choisis.",
    items:[
      {t:"« Bye! » veut dire « Salut ! » quand on s'en va.", a:true, x:"Vrai : Bye = salut (au revoir)."},
      {t:"« See you! » veut dire « À bientôt ! ».", a:true, x:"Vrai : See you = à bientôt."},
      {t:"On dit « Hi! » quand on part.", a:false, x:"Faux : Hi = salut pour dire bonjour. Pour partir, on dit Bye! ou Goodbye!"},
      {t:"On dit « Good night » en arrivant chez sa grand-mère le soir.", a:false, x:"Faux : en arrivant le soir, on dit Good evening. Good night, c'est pour aller dormir."},
      {t:"« Good afternoon » = bonjour l'après-midi.", a:true, x:"Vrai : afternoon = après-midi."},
      {t:"« pet » veut dire « animal de compagnie ».", a:true, x:"Vrai : a pet = un animal de compagnie (cat, dog, fish…)."}
    ] }
];

const MAX = 6 + 6 + 5 + 5 + 5 + 6; // 33
let stars = 0, part = 0, review = [];
const app = document.getElementById("app");

function updTotal(){ document.getElementById("total").textContent = "⭐ " + stars + " / " + MAX; }
function drawSteps(){
  document.getElementById("steps").innerHTML = PARTS.map((p,i) => '<i class="' + (i < part ? "done" : i === part ? "now" : "") + '" title="' + esc(p.title) + '"></i>').join("");
}
function next(){ part++; drawSteps(); if (part < PARTS.length) render(); else finish(); }
function head(p, extra){ return '<div class="kicker">Partie ' + (part+1) + ' sur ' + PARTS.length + (extra ? ' · ' + extra : '') + '</div><h2>' + p.title.replace(/^\d+\.\s*/,"") + '</h2><p class="help">' + p.help + '</p>'; }
function addReview(s){ if (review.indexOf(s) < 0) review.push(s); }

function render(){
  const p = PARTS[part];
  ({memory:renderMemory, hisher:renderChoice, size:renderChoice, tf:renderChoice, spell:renderSpell, build:renderBuild})[p.id](p);
}

// ---------- 1. Memory ----------
function renderMemory(p){
  const cards = shuffle(p.pairs.flatMap((pr,i) => [{k:i, t:pr[0], en:true}, {k:i, t:pr[1], en:false}]));
  let open = [], found = 0, tries = 0, lock = false;
  app.innerHTML = '<div class="card">' + head(p) + '<div class="mem" id="mem"></div><p class="small" id="mi">Coups : 0</p></div>';
  const mem = document.getElementById("mem");
  cards.forEach((c, idx) => {
    const d = document.createElement("button");
    d.className = "mc hide"; d.textContent = c.t; d.setAttribute("aria-label","carte cachée");
    d.onclick = () => {
      if (lock || d.classList.contains("found") || d.classList.contains("open")) return;
      d.classList.remove("hide"); d.classList.add("open"); d.setAttribute("aria-label", c.t);
      if (c.en) say(c.t);
      open.push({d, c});
      if (open.length === 2){
        tries++; document.getElementById("mi").textContent = "Coups : " + tries;
        const [a, b] = open;
        if (a.c.k === b.c.k && a.c.en !== b.c.en){
          a.d.classList.add("found"); b.d.classList.add("found"); open = []; found++; stars++; updTotal();
          if (found === p.pairs.length){
            setTimeout(() => {
              const fb = document.createElement("div"); fb.className = "fb ok";
              fb.innerHTML = "Bravo ! Tu as trouvé les 6 paires en " + tries + " coups. ⭐ x 6";
              const r = document.createElement("div"); r.className = "row";
              const b2 = document.createElement("button"); b2.className = "btn"; b2.textContent = "Partie suivante →"; b2.onclick = next;
              r.appendChild(b2); mem.parentNode.appendChild(fb); mem.parentNode.appendChild(r);
            }, 300);
          }
        } else {
          lock = true;
          setTimeout(() => { [a,b].forEach(o => { o.d.classList.remove("open"); o.d.classList.add("hide"); o.d.setAttribute("aria-label","carte cachée"); }); open = []; lock = false; }, 1000);
        }
      }
    };
    mem.appendChild(d);
  });
}

// ---------- 2, 5, 6. Choix ----------
function renderChoice(p){
  const items = shuffle(p.items); let i = 0;
  function one(){
    const it = items[i];
    let q, opts, correct;
    if (p.id === "hisher"){ q = '<div class="big">' + it.e + '</div>' + esc(it.t); opts = ["His","Her"]; correct = it.a; }
    else if (p.id === "size"){ q = "Le plus grand : "; opts = shuffle(it.o); correct = it.a; }
    else { q = esc(it.t); opts = ["Vrai","Faux"]; correct = it.a ? "Vrai" : "Faux"; }
    app.innerHTML = '<div class="card">' + head(p, "question " + (i+1) + " / " + items.length) + '<div class="q">' + q + '</div><div class="opts" id="opts"></div><div class="fb" id="fb"></div><div class="row" id="row"></div></div>';
    const box = document.getElementById("opts");
    opts.forEach(o => {
      const b = document.createElement("button"); b.className = "opt"; b.textContent = o;
      if (p.id === "size") b.innerHTML = esc(o) + ' <span aria-hidden="true">🔊</span>';
      b.onclick = () => {
        if (p.id === "size") say(o);
        const ok = o === correct;
        [...box.children].forEach(x => { x.disabled = true; if (x.textContent.replace(" 🔊","") === correct) x.classList.add("ok"); });
        if (!ok){ b.classList.add("bad"); addReview(p.id === "tf" ? it.t : p.id === "size" ? it.o.join(" / ") : it.t.replace("___", correct).replace(/\s*\(.*\)$/, "")); }
        else { stars++; updTotal(); }
        const fb = document.getElementById("fb"); fb.className = "fb " + (ok ? "ok" : "bad");
        fb.innerHTML = (ok ? "✅ Bravo ! " : "❌ Pas tout à fait. ") + esc(it.x);
        if (p.id === "hisher") say(it.t.replace("___", correct).replace(/\s*\(.*\)$/, ""));
        const nb = document.createElement("button"); nb.className = "btn"; nb.textContent = (i < items.length - 1) ? "Question suivante →" : "Partie suivante →";
        nb.onclick = () => { i++; if (i < items.length) one(); else next(); };
        document.getElementById("row").appendChild(nb); nb.focus();
      };
      box.appendChild(b);
    });
  }
  one();
}

// ---------- 3. Épeler ----------
function renderSpell(p){
  const items = shuffle(p.items); let i = 0;
  function one(){
    const it = items[i]; let tries = 0;
    const spelled = it.w.toUpperCase().split("").join(", ");
    app.innerHTML = '<div class="card">' + head(p, "mot " + (i+1) + " / " + items.length) +
      '<div class="big">' + it.e + '</div>' +
      '<div class="row"><button class="btn" id="play">🔊 Écouter les lettres</button><button class="btn ghost" id="slow">🐢 Plus lentement</button></div>' +
      '<div class="row"><input type="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Écris le mot"><button class="btn" id="ok">Vérifier</button></div>' +
      '<div class="fb" id="fb"></div><div class="row" id="row"></div></div>';
    const inp = document.getElementById("inp"), fb = document.getElementById("fb");
    document.getElementById("play").onclick = () => say(spelled, .6);
    document.getElementById("slow").onclick = () => say(spelled, .45);
    setTimeout(() => say(spelled, .6), 300);
    function check(){
      const v = inp.value.trim().toLowerCase();
      if (!v) return;
      if (v === it.w.toLowerCase()){
        if (tries === 0){ stars++; updTotal(); }
        fb.className = "fb ok"; fb.innerHTML = "✅ Bravo ! <b>" + esc(it.w) + "</b>" + (tries ? " (bonne réponse au 2e essai)" : "");
        done();
      } else if (tries === 0){
        tries = 1; addReview(it.w);
        fb.className = "fb bad"; fb.innerHTML = "❌ Presque ! Indice : le mot commence par <b>" + esc(it.w[0]) + "</b> et a <b>" + it.w.length + "</b> lettres. Écoute encore et réessaie.";
        inp.select();
      } else {
        fb.className = "fb bad"; fb.innerHTML = "La bonne réponse est <b>" + esc(it.w) + "</b> : " + esc(it.w.toUpperCase().split("").join(" - ")) + ".";
        done();
      }
    }
    function done(){
      inp.disabled = true; document.getElementById("ok").disabled = true; say(it.w);
      const nb = document.createElement("button"); nb.className = "btn"; nb.textContent = (i < items.length - 1) ? "Mot suivant →" : "Partie suivante →";
      nb.onclick = () => { i++; if (i < items.length) one(); else next(); };
      document.getElementById("row").appendChild(nb); nb.focus();
    }
    document.getElementById("ok").onclick = check;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    inp.focus();
  }
  one();
}

// ---------- 4. Construire la phrase ----------
function renderBuild(p){
  const items = shuffle(p.items); let i = 0;
  function one(){
    const it = items[i]; const pool = shuffle(it.s.concat(it.extra ? [it.extra] : []));
    let chosen = [];
    app.innerHTML = '<div class="card">' + head(p, "phrase " + (i+1) + " / " + items.length) +
      '<div class="q">🇫🇷 ' + esc(it.fr) + '</div><div class="answer" id="ans"></div><div class="pool" id="pool"></div>' +
      '<div class="row"><button class="btn" id="ok">Vérifier</button><button class="btn ghost" id="clr">Effacer</button></div>' +
      '<div class="fb" id="fb"></div><div class="row" id="row"></div></div>';
    const ans = document.getElementById("ans"), pl = document.getElementById("pool");
    let locked = false;
    function draw(){
      ans.innerHTML = ""; chosen.forEach((idx, n) => {
        const t = document.createElement("button"); t.className = "tile"; t.textContent = pool[idx];
        t.onclick = () => { if (locked) return; chosen.splice(n,1); draw(); }; ans.appendChild(t);
      });
      pl.innerHTML = ""; pool.forEach((w, idx) => {
        const t = document.createElement("button"); t.className = "tile" + (chosen.indexOf(idx) >= 0 ? " used" : ""); t.textContent = w;
        t.onclick = () => { if (locked || chosen.indexOf(idx) >= 0) return; chosen.push(idx); draw(); }; pl.appendChild(t);
      });
    }
    draw();
    document.getElementById("clr").onclick = () => { if (!locked){ chosen = []; draw(); } };
    document.getElementById("ok").onclick = () => {
      if (locked || !chosen.length) return;
      locked = true;
      const got = chosen.map(k => pool[k]).join(" "), good = it.s.join(" ");
      const fb = document.getElementById("fb");
      if (got === good){ stars++; updTotal(); fb.className = "fb ok"; fb.innerHTML = "✅ Bravo ! <b>" + esc(good) + "</b>"; }
      else { addReview(good); fb.className = "fb bad"; fb.innerHTML = "❌ La bonne phrase est : <b>" + esc(good) + "</b>" + (it.extra ? "<br>Le mot en trop était « " + esc(it.extra) + " »." : ""); }
      say(good);
      document.getElementById("ok").disabled = true; document.getElementById("clr").disabled = true;
      const nb = document.createElement("button"); nb.className = "btn"; nb.textContent = (i < items.length - 1) ? "Phrase suivante →" : "Partie suivante →";
      nb.onclick = () => { i++; if (i < items.length) one(); else next(); };
      document.getElementById("row").appendChild(nb); nb.focus();
    };
  }
  one();
}

// ---------- Fin ----------
function finish(){
  const pct = stars / MAX;
  const msg = pct >= .9 ? "Champion ! 🏆" : pct >= .7 ? "Très bien ! 👏" : pct >= .5 ? "Bien joué, continue ! 💪" : "Courage, on refait encore une fois ! 🙂";
  let best = 0; try{ best = +localStorage.getItem("louis-anglais-unit1-mercredi") || 0; if (stars > best) localStorage.setItem("louis-anglais-unit1-mercredi", stars); }catch(e){}
  app.innerHTML = '<div class="card end"><div class="stars">⭐⭐⭐</div><h2>' + msg + '</h2>' +
    '<p class="q">Tu as ' + stars + ' étoiles sur ' + MAX + '.</p>' +
    (best && best > stars ? '<p class="small">Ton record : ' + best + ' / ' + MAX + '</p>' : '') +
    (review.length ? '<p><b>Mots et phrases à revoir :</b></p><ul>' + review.map(r => '<li>' + esc(r) + '</li>').join("") + '</ul>' : '<p>Aucune erreur, bravo !</p>') +
    '<p class="small">Note ton score dans ton QG Notion.</p>' +
    '<div class="row" style="justify-content:center"><button class="btn" onclick="location.reload()">🔄 Recommencer</button></div></div>';
}

drawSteps(); updTotal(); render();
</script>
</body>
</html>
