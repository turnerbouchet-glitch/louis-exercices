<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 1 – Mardi</title>
<style>
  :root{--bg:#f3f7ff;--card:#fff;--ink:#1d2340;--muted:#5b6385;--blue:#3b6cf6;--blue-soft:#e3ebff;--green:#1f9d55;--green-soft:#dcf5e6;--red:#d64545;--red-soft:#fde4e4;--line:#d9e0f2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:19px;line-height:1.45}
  header{background:#3b6cf6;color:#fff;padding:14px 16px}
  header .row{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:23px}
  .stars{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-weight:700}
  main{max-width:760px;margin:0 auto;padding:16px}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
  .step{flex:1;min-width:110px;text-align:center;font-size:14px;padding:6px 4px;border-radius:10px;background:#e6eaf5;color:var(--muted)}
  .step.on{background:var(--blue);color:#fff;font-weight:700}
  .step.done{background:var(--green-soft);color:var(--green);font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 14px rgba(30,50,120,.06)}
  .kicker{color:var(--muted);font-size:15px;margin-bottom:4px}
  h2{margin:0 0 6px;font-size:24px}
  .intro{color:var(--muted);margin:0 0 14px}
  .prompt{font-size:23px;margin:10px 0 14px}
  .big{font-size:64px;line-height:1;margin:6px 0}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .opts.emoji button{font-size:46px;padding:14px}
  button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:12px 14px}
  button:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
  button:disabled{cursor:default}
  .ok{border-color:var(--green)!important;background:var(--green-soft)!important}
  .ko{border-color:var(--red)!important;background:var(--red-soft)!important;opacity:.7}
  .tool{border:none;background:var(--blue-soft);color:var(--blue);font-weight:700;padding:10px 14px;margin:0 8px 10px 0}
  .main-btn{background:var(--blue);color:#fff;border:none;font-weight:700;padding:12px 22px}
  .main-btn:hover{background:#2c56d4!important;color:#fff}
  .fb{margin-top:14px;padding:12px 14px;border-radius:12px;display:none}
  .fb.good{display:block;background:var(--green-soft)} .fb.hint{display:block;background:#fff6d8} .fb.bad{display:block;background:var(--red-soft)}
  .next{margin-top:14px;text-align:right}
  .hidden-word{color:var(--muted);font-style:italic}
  .end{text-align:center} .end .score{font-size:44px;font-weight:800;color:var(--blue);margin:8px 0}
  .review{text-align:left;background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin:14px 0}
  .small{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="row"><h1>🇬🇧 Unit 1 · Mission du mardi 17.11</h1><div class="stars" id="stars">⭐ 0</div></div></header>
<main>
  <div class="steps" id="steps"></div>
  <div class="card" id="card"></div>
  <p class="small">⭐ = juste du premier coup. Si tu te trompes, tu as un indice et un 2e essai. Pas besoin d'écrire : tu écoutes, tu lis et tu cliques !</p>
</main>
<script>
const SECTIONS = [{"title": "Pets", "emoji": "🐾", "intro": "Écoute le mot 🔊 et clique sur le bon animal.", "questions": [{"answer": "🐰", "opts": ["🐰", "🐹", "🐭", "🐶"], "hint": "Il a de grandes oreilles.", "explain": "rabbit = lapin", "label": "rabbit (lapin)", "say": "rabbit"}, {"answer": "🐭", "opts": ["🐱", "🐭", "🐟", "🐰"], "hint": "Elle a peur du chat.", "explain": "mouse = souris", "label": "mouse (souris)", "say": "mouse"}, {"answer": "🐹", "opts": ["🐹", "🐶", "🐰", "🐭"], "hint": "C'est presque le même mot qu'en français.", "explain": "hamster = hamster", "label": "hamster", "say": "hamster"}, {"answer": "🐟", "opts": ["🐱", "🐶", "🐟", "🐹"], "hint": "Il vit dans l'eau.", "explain": "fish = poisson", "label": "fish (poisson)", "say": "fish"}, {"answer": "🐶", "opts": ["🐶", "🐱", "🐭", "🐟"], "hint": "Il fait « ouaf ».", "explain": "dog = chien", "label": "dog (chien)", "say": "dog"}, {"answer": "🐱", "opts": ["🐰", "🐹", "🐱", "🐶"], "hint": "Il fait « miaou ».", "explain": "cat = chat", "label": "cat (chat)", "say": "cat"}]}, {"title": "Hello!", "emoji": "👋", "intro": "Lis la situation. Que dis-tu en anglais ?", "questions": [{"answer": "Good morning!", "opts": ["Good morning!", "Good night!", "Good evening!"], "hint": "Morning = le matin.", "explain": "Le matin (jusqu'à midi) : Good morning!", "label": "Good morning (le matin)", "prompt": "⏰ 8 h. Tu arrives à l'école."}, {"answer": "Good afternoon!", "opts": ["Good evening!", "Good afternoon!", "Good night!"], "hint": "After noon = après midi.", "explain": "L'après-midi : Good afternoon!", "label": "Good afternoon (l'après-midi)", "prompt": "⏰ 15 h. Tu rencontres ta voisine."}, {"answer": "Good evening!", "opts": ["Good night!", "Good morning!", "Good evening!"], "hint": "Tu arrives : c'est « bonsoir », pas « bonne nuit ».", "explain": "Le soir, en arrivant : Good evening!", "label": "Good evening (le soir)", "prompt": "⏰ 19 h. Tu arrives chez ta grand-maman."}, {"answer": "Good night!", "opts": ["Good night!", "Good afternoon!", "Hi!"], "hint": "Night = la nuit.", "explain": "Pour aller dormir : Good night!", "label": "Good night (pour dormir)", "prompt": "🛏️ Tu vas te coucher."}, {"answer": "Goodbye!", "opts": ["Hello!", "Goodbye!", "Good morning!"], "hint": "Tu pars : c'est « au revoir ».", "explain": "Goodbye! (ou Bye! / See you!) = au revoir.", "label": "Goodbye (au revoir)", "prompt": "🏫 L'école est finie. Tu dis au revoir à ta maîtresse."}]}, {"title": "His ou Her ?", "emoji": "👦👧", "intro": "His = pour un garçon. Her = pour une fille. Choisis le bon mot.", "questions": [{"answer": "Her", "opts": ["His", "Her"], "hint": "Léa, c'est une fille.", "explain": "Léa est une fille : Her name's Léa.", "label": "Her name's… (fille)", "prompt": "👧 ___ name's Léa."}, {"answer": "His", "opts": ["His", "Her"], "hint": "Tom, c'est un garçon.", "explain": "Tom est un garçon : His name's Tom.", "label": "His name's… (garçon)", "prompt": "👦 ___ name's Tom."}, {"answer": "His", "opts": ["Her", "His"], "hint": "Le chien s'appelle Max : c'est un mâle.", "explain": "Max est un chien mâle : His name's Max.", "label": "His (animal mâle)", "prompt": "🐶 This is my dog. ___ name's Max."}, {"answer": "Her", "opts": ["Her", "His"], "hint": "Bella est une chatte.", "explain": "Bella est une femelle : Her name's Bella.", "label": "Her (animal femelle)", "prompt": "🐱 This is my cat. ___ name's Bella."}, {"answer": "His", "opts": ["His", "Her"], "hint": "Louis, c'est toi : un garçon !", "explain": "His name's Louis.", "label": "His name's Louis", "prompt": "👦 ___ name's Louis."}]}, {"title": "Words", "emoji": "✨", "intro": "Lis le mot anglais. Que veut-il dire en français ?", "questions": [{"answer": "génial", "opts": ["génial", "non", "et"], "hint": "On dit ce mot aussi en français !", "explain": "cool = génial", "label": "cool (génial)", "prompt": "cool", "say": "cool"}, {"answer": "bien", "opts": ["super", "bien", "oui"], "hint": "I'm …, thanks. = Je vais …, merci.", "explain": "fine = bien", "label": "fine (bien)", "prompt": "fine", "say": "fine"}, {"answer": "super", "opts": ["super", "non", "animal de compagnie"], "hint": "Le mot ressemble à « grand ».", "explain": "great = super", "label": "great (super)", "prompt": "great", "say": "great"}, {"answer": "animal de compagnie", "opts": ["et", "animal de compagnie", "bien"], "hint": "Un chat ou un chien à la maison.", "explain": "pet = animal de compagnie", "label": "pet (animal de compagnie)", "prompt": "pet", "say": "pet"}, {"answer": "oui", "opts": ["non", "oui", "génial"], "hint": "Le contraire de no.", "explain": "yes = oui", "label": "yes (oui)", "prompt": "yes", "say": "yes"}]}];
const TOTAL = SECTIONS.reduce((n,s)=>n+s.questions.length,0);
let S,Q,tries,stars,missed,order;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang.replace("_","-")));return v.find(x=>x.name.indexOf("Daniel")===0)||v.find(x=>/premium|enhanced|natural/i.test(x.name))||v.find(x=>/^en-GB/i.test(x.lang.replace("_","-")))||v[0]||null}catch(e){return null}}
function say(t,rate){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=rate||0.66;const v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u)}
if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}
function start(){S=0;stars=0;missed=[];startSection()}
function startSection(){Q=0;order=shuffle(SECTIONS[S].questions);renderQ()}
function renderSteps(){const st=document.getElementById("steps");st.innerHTML="";SECTIONS.forEach((s,i)=>{const d=document.createElement("div");d.className="step"+(i<S?" done":i===S?" on":"");d.textContent=s.emoji+" "+s.title;st.appendChild(d)});document.getElementById("stars").textContent="⭐ "+stars+" / "+TOTAL}
function renderQ(){
  tries=0;renderSteps();
  const sec=SECTIONS[S],q=order[Q],card=document.getElementById("card");
  let h=`<div class="kicker">Partie ${S+1} / ${SECTIONS.length} · Question ${Q+1} / ${order.length}</div><h2>${sec.emoji} ${sec.title}</h2><p class="intro">${sec.intro}</p>`;
  if(q.big)h+=`<div class="big">${q.big}</div>`;
  if(q.prompt)h+=`<div class="prompt">${q.prompt}</div>`;
  if(q.say){h+=`<button class="tool" id="listen">🔊 Écouter</button><button class="tool" id="slow">🐢 Plus lentement</button>`;if(!q.prompt)h+=`<button class="tool" id="peek">👀 Voir</button> <span class="hidden-word" id="word"></span>`}
  const emo=q.opts.every(o=>[...o].length<=2);
  h+=`<div class="opts${emo?" emoji":""}" id="opts"></div><div class="fb" id="fb"></div><div class="next" id="next"></div>`;
  card.innerHTML=h;
  if(q.say){document.getElementById("listen").onclick=()=>say(q.say);document.getElementById("slow").onclick=()=>say(q.say,0.45);setTimeout(()=>say(q.say),350)}
  const P=document.getElementById("peek");if(P)P.onclick=()=>{document.getElementById("word").textContent=q.say};
  const box=document.getElementById("opts");
  shuffle(q.opts).forEach(o=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>pick(b,o,q);box.appendChild(b)});
}
function pick(b,o,q){
  const fb=document.getElementById("fb"),btns=[...document.querySelectorAll("#opts button")];
  if(o===q.answer){b.classList.add("ok");btns.forEach(x=>x.disabled=true);
    if(tries===0){stars++;fb.className="fb good";fb.innerHTML="⭐ Bravo ! "+q.explain}else{fb.className="fb good";fb.innerHTML="✅ Oui, bien trouvé ! "+q.explain}
    if(q.say)setTimeout(()=>say(q.say),200);done();
  }else{tries++;b.classList.add("ko");b.disabled=true;
    if(tries===1){fb.className="fb hint";fb.innerHTML="🤔 Pas encore. Indice : "+q.hint}
    else{btns.forEach(x=>{x.disabled=true;if(x.textContent===q.answer)x.classList.add("ok")});fb.className="fb bad";fb.innerHTML="La bonne réponse est <b>"+q.answer+"</b>. "+q.explain;missed.push(q.label);done()}}
}
function done(){
  document.getElementById("stars").textContent="⭐ "+stars+" / "+TOTAL;
  const n=document.getElementById("next"),last=Q===order.length-1,lastSec=S===SECTIONS.length-1;
  const b=document.createElement("button");b.className="main-btn";
  b.textContent=!last?"Question suivante →":!lastSec?"Partie suivante →":"Voir mon score 🏆";
  b.onclick=()=>{if(!last){Q++;renderQ()}else if(!lastSec){S++;startSection()}else finish()};
  n.appendChild(b);b.focus();
}
function finish(){
  S=SECTIONS.length;renderSteps();const r=stars/TOTAL;
  const msg=r>=0.9?"Excellent, Louis ! 🏆":r>=0.7?"Très bien, Louis ! Encore quelques mots à revoir. 💪":"Bon travail, Louis ! Tu progresses à chaque fois. 🌱";
  let h=`<div class="end"><h2>🎉 Well done!</h2><div class="score">⭐ ${stars} / ${TOTAL}</div><p>${msg}</p>`;
  h+=missed.length?`<div class="review"><b>À revoir :</b><ul>${missed.map(m=>"<li>"+m+"</li>").join("")}</ul></div>`:`<p>Aucune erreur : parfait ! 🌟</p>`;
  h+=`<p class="small">Montre ton score à papa ou maman.</p><button class="main-btn" id="again">🔁 Recommencer</button></div>`;
  document.getElementById("card").innerHTML=h;document.getElementById("again").onclick=start;
}
start();
</script>
</body>
</html>
